    <title>Handleman — browser demo | Stoatworks Labs</title>
    <meta name="description" content="Try the Handleman FFGL plugin for Resolume in your browser: a hand-cranked camera and projector for your clip. Sepia or black and white, a frame rate that won't sit still, wear on the print, and a button that runs the reel out. The plugin's own capture, resample and output shaders ported to WebGL2, so the loop of film, the stock, the curve, the tones and the marks run on your GPU; the two hands, the shutter's light per projector frame, the weave, the print's marks and the run-out are a hand port to JavaScript. The flicker beats against your display's own rate." />
