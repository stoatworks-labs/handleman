    <main id="demo">
      <noscript>
        <h1>Handleman</h1>
        <p>
          An FFGL effect that puts your clip through a hand-cranked camera and a
          hand-cranked projector. Neither hand is a motor: the cameraman's
          decides when each frame was exposed, so motion rushes and drags and
          the picture breathes lighter and darker with it, and the
          projectionist's decides how long each frame stays on the screen, so
          the flicker wanders. The print is orthochromatic or panchromatic
          silver, sepia toned or tinted, with grain, weave, scratches, dust and
          the odd hair. And there's a Run Out button that runs the reel out to
          blank cells.
        </p>
        <p>
          This demo runs the plugin's shaders and a port of its CPU half in your
          browser, so it needs JavaScript and WebGL2. The plugin itself, its
          source and its downloads are on
          <a href="https://github.com/stoatworks-labs/handleman">its repository</a>.
        </p>
